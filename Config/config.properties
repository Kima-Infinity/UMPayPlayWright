url=https://test.umpay.io/login
register.url=https://test.umpay.io/register
reset.password.url=https://test.umpay.io/forgot-password

# --- Browser window ---
# false runs Chrome with a visible window, true runs it headless.
# A single run can be flipped without editing this file:
#   mvn test -Dheadless=true
#   mvn test -Dheadless=false
# The -D value always wins over the one set here.
headless=false
# Seconds the register scenarios wait for a captcha code to be typed by hand.
# Not used when the code comes from the test data or from -Dumpay.captcha
captcha.manual.timeout=180

# --- Captcha OCR (ddddocr, offline) ---
# Used when the CaptchaCode column of the test data says AUTO. The code is read
# from the image by a local ONNX model instead of by a human. Recognition is far
# from perfect, so a rejected code refreshes the captcha and tries the next one;
# captcha.ocr.attempts caps how many images to work through before giving up.
# Set captcha.ocr.enabled=false to send every AUTO row back to manual typing.
# Forward slashes are required: java.util.Properties reads a backslash as an escape.
captcha.ocr.enabled=true
captcha.ocr.python=C:/Users/Hp15s-fq2/AppData/Local/Programs/Python/Python312/python.exe
# Relative to the project directory, which is where a run starts from - the same
# place ./Config/config.properties itself is read from. The captcha tool now lives
# inside each project rather than in one shared folder beside them, so this stays
# correct on any machine and for any checkout.
captcha.ocr.script=Captcha/ocr.py
# 0 restricts the model to digits, which is what the test environment issues.
captcha.ocr.ranges=0
# Each attempt is cheap - a misread is discarded without a submit, and a rejected
# code is detected in under a second - so ten is roughly a minute in the worst case.
captcha.ocr.attempts=10
# --- Reading the registration code out of the mailbox (IMAP) ---
# Uses the same Gmail app password as the report mailer, from UMPAY_MAIL_PASSWORD.
# The message is matched on the +timestamp alias the run registered, so it can
# never pick up an older code. Set mail.imap.enabled=false to type codes by hand.
# Requires IMAP to be switched on in Gmail: Settings > Forwarding and POP/IMAP.
mail.imap.enabled=true
mail.imap.host=imap.gmail.com
mail.imap.port=993

mail.smtp.host=smtp.gmail.com
mail.smtp.port=465
mail.from=lawma195.infinity@gmail.com
# mail.password is read from the UMPAY_MAIL_PASSWORD environment variable, not from this file
mail.to=lawma195.infinity@gmail.com
mail.smtp.auth=true
mail.smtp.starttls.enable=true